# Mayor word filter. After editing, run /mayor reload.
#
# How words match:
# - Whole words only, so "class", "assume" and "Scunthorpe" are fine.
# - Letter case and accents don't matter, and common swaps are seen through: 0=o, 1=i, 3=e, 4=a, 5=s, 7=t, 8=b, @=a, $=s.
# - Stretched letters still match: "shiiit". A word never matches a shorter form of itself.
# - A * at the end also matches longer endings: "swear*" matches "swearing". Use it with care.
# - Several words in one entry match those words in a row: "kill yourself".
# Words in the allow list are never blocked, even if an entry matches them.
#
# Blocked text is never logged or stored. The player is told kindly and can try again.
# Limits: words spelled with spaces or dots between letters ("f u ..."), and made-up spellings, get through.
# This list is a starting point. Change it to suit your players.
