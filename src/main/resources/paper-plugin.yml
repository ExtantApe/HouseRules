name: HouseRules
version: '${version}'
main: com.extantape.houserules.HouseRulesPlugin
api-version: '26.1'
description: Sets who can hear whom in chat and private messages, with chat circles, blocked commands and a word filter.
website: https://github.com/ExtantApe/HouseRules
# Commands are registered with Brigadier in code, so there is no commands section.
dependencies:
  server:
    # Optional. Only so HouseRules can see BlueMapHUD's share event class and filter /hud share like chat.
    BlueMapHUD:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  houserules.bypass:
    description: Reach, and be reached by, everyone, for moderators. It doesn't show anyone else's chat.
    default: false
  houserules.circles:
    description: Use /circles to see your circles and who can hear you.
    default: true
  houserules.circles.names:
    description: See names, not just a count, in /circles.
    default: true
  houserules.admin:
    description: Use /houserules reload, status and check, and hear about config problems on joining.
    default: op
