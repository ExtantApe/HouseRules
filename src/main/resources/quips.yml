  - "<gray>Nobody here can hear you right now. The bees buzzed something back, though."
  - "<gray>Your message got lost in a mineshaft. The minecarts are looking for it."
  - "<gray>Nobody heard that. A fox may have taken it, they do that."
  - "<gray>That was said to an empty room, and the room was very impressed."
  - "<gray>Nobody's listening right now. An allay is fetching someone, maybe."
  - "<gray>Your message wandered off to find a friend. Try /circles to see who can hear you."
  - "<gray>Only the stars heard that. They twinkled, which is star for \"nice\"."
  - "<gray>Nobody's here to hear you, but your words were well chosen."
  - "<gray>A turtle heard you. It'll reply in about forty years."
  - "<gray>Your message made a cosy little house for itself. Nobody's visited yet."
  - "<gray>Nobody heard you. An armadillo curled up, which may mean \"agreed\"."
