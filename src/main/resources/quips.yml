  - "<gray>The chat is empty except for you and an imaginary parrot. The parrot loved it."
  - "<gray>Nobody here to hear that. Maybe write it on a sign for later?"
  - "<gray>Your words drift into the sky and become a tiny star."
  - "<gray>Nobody heard that, but a snail is slowly making its way over to listen."
  - "<gray>Out here, only the sheep can hear you. They said baa."
  - "<gray>Message sent to the moon. Expected arrival: next Tuesday."
  - "<gray>Nobody's around to hear you right now. Try /circles to see who is."
  - "<gray>The sound of one player chatting. Very peaceful."
  - "<gray>Nobody can hear you, but a glow squid gave you a sparkly thumbs up."
  - "<gray>Your message tiptoed away. It was very shy."
  - "<gray>Nobody in earshot. A frog heard you and croaked approvingly."
