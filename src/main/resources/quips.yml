# Notes for players who chat when nobody online can hear them. One is picked at a time, in a shuffled
# order, and a player sees every note before any comes round again. Keep them light-hearted, never mean.
# MiniMessage formatting works. After editing, run /houserules reload. How often is set in config.yml.
notes:
  - "<gray>Your words float off into the void. The void says thanks."
  - "<gray>A passing cloud heard that. Sadly, clouds don't type back."
  - "<gray>Nobody here can hear you right now, but a nearby chicken looks interested."
  - "<gray>Echo... echo... echo... (that was just you.)"
  - "<gray>Message delivered to: one very attentive cave spider. Probably."
  - "<gray>The trees heard you. They're thinking about it. Trees think slowly."
  - "<gray>Nobody can hear you just now. Your message has been filed under \"brilliant, but early\"."
  - "<gray>Plot twist: you're the only one in this chat right now."
  - "<gray>A squid nods politely. It didn't understand a word."
  - "<gray>Your message went out on a paper boat. It may be some time."
  - "<gray>Nobody's in earshot. Try /circles to see who can hear you."
  - "<gray>The wind carries your words away. The wind is a terrible listener."
  - "<gray>Shh, the cows are sleeping. Nobody else can hear you right now."
  - "<gray>You said that to the whole world. The world was busy."
  - "<gray>Message received by: absolutely nobody. But it was a good one."
  - "<gray>A bat squeaked back. That's probably a yes."
  - "<gray>Nobody heard that, so you can say it again later and it'll be brand new."
  - "<gray>Your words bounce off a mountain and come right back to you."
  - "<gray>Nobody's listening right now. Even the creepers are keeping to themselves."
  - "<gray>That message is now a very small, very lonely cloud."
  - "<gray>A villager heard you and said \"Hmm.\" That's all they ever say."
  - "<gray>Nobody can hear you right now. Your pet would have listened, though."
